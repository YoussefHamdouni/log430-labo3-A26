name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Tests (MySQL + Redis)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dépôt
        uses: actions/checkout@v4

      - name: Créer le fichier .env à partir des secrets
        env:
          DB_USER: ${{ secrets.DB_USER || 'labo03' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'labo03' }}
        run: |
          {
            echo "DB_HOST=mysql"
            echo "DB_PORT=3306"
            echo "DB_NAME=labo03_db"
            echo "DB_USER=${DB_USER}"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "REDIS_HOST=redis"
            echo "REDIS_PORT=6379"
            echo "REDIS_DB=0"
          } > .env

      - name: Démarrer les conteneurs (attend que MySQL et Redis soient « healthy »)
        run: |
          docker network create labo03-network
          docker compose up -d --build --wait --wait-timeout 180

      - name: Exécuter les tests
        run: docker compose exec -T store_manager pytest -v

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Nettoyage
        if: always()
        run: docker compose down -v

  publish:
    name: Publier l'image sur GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout dépôt
        uses: actions/checkout@v4

      - name: Authentification à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Déterminer le nom de l'image (minuscules)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
